<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" width="1120" height="270" role="img" aria-label="Bridge State Machine and Git Guard Safety Flow">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F87171"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
    .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    .node { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #F8FAFC; text-anchor: middle; }
    .node-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; text-anchor: middle; }
    .edge { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94A3B8; text-anchor: middle; }
  </style>

  <rect width="1120" height="270" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="32" y="38" class="title">.ag-bridge/ Task State Machine &amp; Lossless Git Rollback</text>
  <text x="32" y="58" class="sub">Atomic .tmp → rename state transitions · Single-task lock (BRIDGE_BUSY) · Stale timeout auto-archive</text>

  <!-- IDLE -->
  <rect x="42" y="102" width="160" height="64" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="122" y="130" class="node">IDLE</text>
  <text x="122" y="150" class="node-sub">Ready / Rolled back</text>

  <!-- DISPATCHED -->
  <rect x="282" y="102" width="186" height="64" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="375" y="130" class="node">DISPATCHED</text>
  <text x="375" y="150" class="node-sub">Git checkpoint + dispatch.md</text>

  <!-- RUNNING -->
  <rect x="548" y="102" width="186" height="64" rx="10" fill="#312E81" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="641" y="130" class="node">RUNNING</text>
  <text x="641" y="150" class="node-sub">lockedPaths enforced</text>

  <!-- VERIFIED -->
  <rect x="838" y="76" width="236" height="58" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="956" y="102" class="node">VERIFIED</text>
  <text x="956" y="121" class="node-sub">report.md + artifacts returned</text>

  <!-- FAILED -->
  <rect x="838" y="156" width="236" height="58" rx="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="956" y="182" class="node">FAILED</text>
  <text x="956" y="201" class="node-sub">Timeout / Max turns / Error</text>

  <!-- Forward Arrows -->
  <line x1="202" y1="134" x2="278" y2="134" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="124" class="edge">delegate</text>

  <line x1="468" y1="134" x2="544" y2="134" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="506" y="124" class="edge">claim</text>

  <path d="M 734 122 C 776 122, 790 105, 834 105" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="784" y="100" class="edge">pass</text>

  <path d="M 734 146 C 776 146, 790 185, 834 185" fill="none" stroke="#F87171" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="784" y="176" class="edge">error</text>

  <!-- Rollback Return Arc -->
  <path d="M 956 214 L 956 244 L 122 244 L 122 170" fill="none" stroke="#F87171" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="540" y="236" class="edge">rollback_ag_task  →  restores staged + unstaged + deleted files &amp; preserves pre-existing untracked files</text>
</svg>
