<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" role="img" aria-label="4-Step Quick Start Journey for claude-antigravity-plugin">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
    .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    .step-badge { font: 800 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0B1120; }
    .card-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
    .body { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
    .code { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #38BDF8; }
    .footer { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
  </style>

  <rect width="1120" height="320" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="32" y="40" class="title">From Zero to Full Antigravity Power in 4 Copy-Paste Steps</text>
  <text x="32" y="62" class="subtitle">No manual JSON editing required · Works on macOS, Linux, and Windows · Undo any change in 1 click</text>

  <!-- Step 1 -->
  <rect x="32" y="88" width="236" height="178" rx="12" fill="#131C31" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="48" y="104" width="66" height="22" rx="11" fill="url(#s1)"/>
  <text x="60" y="119" class="step-badge">STEP 1</text>
  <text x="48" y="150" class="card-title">Install &amp; Build</text>
  <text x="48" y="172" class="body">Copy-paste 1 command block</text>
  <text x="48" y="190" class="body">for your OS to clone, compile,</text>
  <text x="48" y="208" class="body">and run the healthcheck.</text>
  <rect x="48" y="222" width="204" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="58" y="240" class="code">git clone ... &amp;&amp; npm build</text>

  <line x1="268" y1="177" x2="300" y2="177" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="306" y="88" width="236" height="178" rx="12" fill="#131C31" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="322" y="104" width="66" height="22" rx="11" fill="url(#s2)"/>
  <text x="334" y="119" class="step-badge">STEP 2</text>
  <text x="322" y="150" class="card-title">Load in Claude Code</text>
  <text x="322" y="172" class="body">Install permanently via</text>
  <text x="322" y="190" class="body">/plugin install or launch</text>
  <text x="322" y="208" class="body">instantly with --plugin-dir.</text>
  <rect x="322" y="222" width="204" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="332" y="240" class="code">/plugin install antigravity</text>

  <line x1="542" y1="177" x2="574" y2="177" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="580" y="88" width="236" height="178" rx="12" fill="#131C31" stroke="#10B981" stroke-width="1.5"/>
  <rect x="596" y="104" width="66" height="22" rx="11" fill="url(#s3)"/>
  <text x="608" y="119" class="step-badge">STEP 3</text>
  <text x="596" y="150" class="card-title">Sign In Inside Chat</text>
  <text x="596" y="172" class="body">Type /ag-login to sign in via</text>
  <text x="596" y="190" class="body">Google OAuth (browser or SSH</text>
  <text x="596" y="208" class="body">link+code). Saved to OS keyring.</text>
  <rect x="596" y="222" width="204" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="606" y="240" class="code">/ag-login   →  23+ models</text>

  <line x1="816" y1="177" x2="848" y2="177" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="854" y="88" width="234" height="178" rx="12" fill="#131C31" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="870" y="104" width="66" height="22" rx="11" fill="url(#s4)"/>
  <text x="882" y="119" class="step-badge">STEP 4</text>
  <text x="870" y="150" class="card-title">Delegate &amp; Automate</text>
  <text x="870" y="172" class="body">Build UI, QA in a real browser,</text>
  <text x="870" y="190" class="body">run background jobs, or run</text>
  <text x="870" y="208" class="body">cross-model code reviews!</text>
  <rect x="870" y="222" width="202" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="880" y="240" class="code">/ag-delegate · /ag-browser</text>

  <!-- Bottom Safety Strip -->
  <text x="32" y="296" class="footer">💡 Every delegation automatically snapshots your workspace with Git Guard — if anything looks off, just type /ag-rollback to undo cleanly.</text>
</svg>
